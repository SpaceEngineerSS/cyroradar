<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CryoRadar · Mars subsurface radar</title>
    <meta name="description" content="Read SHARAD radargrams from NASA's archive or simulate MARSIS and SHARAD scenes, convert echo delay to depth, and test what makes the base of Martian ice bright." />
    <meta name="author" content="Mehmet Gümüş" />
    <meta name="theme-color" content="#121110" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CryoRadar" />
    <meta property="og:description" content="Mars subsurface radar in the browser: SHARAD archive data, simulated scenes, depth conversion and basal reflection analysis." />
    <meta property="og:image" content="https://cyroradar.vercel.app/og.png" />
    <meta property="og:url" content="https://cyroradar.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('cryoradar') || '{}').state;
        if (t && t.theme) document.documentElement.dataset.theme = t.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CryoRadar needs JavaScript to draw radargrams.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
